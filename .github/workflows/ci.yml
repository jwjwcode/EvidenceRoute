name: CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"
            - name: Install project
              run: python -m pip install -e .[dev]
            - name: Run tests
              run: python -m pytest -q
            - name: Run demo
              run: python -mevidence_route.demo --job-file examples/sample_job.json